apiVersion: apps/v1
kind: Deployment
metadata:
  name: anime-hit-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anime-hit-api
  template:
    metadata:
      labels:
        app: anime-hit-api
    spec:
      containers:
        - name: api
          image: anime-hit-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
          env:
            - name: MODEL_BACKEND
              value: "rf"
            - name: RF_MODEL_PATH
              value: /app/artifacts/rf_pipeline.joblib
            - name: RF_META_PATH
              value: /app/artifacts/rf_meta.json
            - name: RF_THRESHOLD_PATH
              value: /app/artifacts/rf_threshold.json
            # Optional HitNet backend (switch MODEL_BACKEND=hitnet)
            - name: ONNX_PATH
              value: /app/artifacts/hitnet.onnx
            - name: PREPROC_PATH
              value: /app/artifacts/preproc.json
            - name: HITNET_THRESHOLD_PATH
              value: /app/artifacts/hitnet_threshold.json
            - name: THRESHOLD
              value: "0.5"
---
apiVersion: v1
kind: Service
metadata:
  name: anime-hit-api-svc
spec:
  type: NodePort
  selector:
    app: anime-hit-api
  ports:
    - port: 9696
      targetPort: 9696
      nodePort: 30080
